name: Lean build (EC formal proofs)

on:
  push:
  pull_request:

jobs:
  lean:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: formal
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (toolchain taken from formal/lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Toolchain versions
        run: lean --version && lake --version
      - name: lake build
        run: lake build
      - name: Forbidden proof escapes
        run: |
          if grep -rnE '\b(sorry|admit|axiom|unsafe|native_decide|implemented_by|extern)\b' --include='*.lean' --exclude-dir=.lake .; then
            echo "forbidden token found"; exit 1
          fi
      - name: Axiom report
        run: |
          lake env lean AxiomCheck.lean | tee axioms.txt
          if grep 'depends on axioms' axioms.txt | grep -vE 'depends on axioms: \[propext, Classical.choice, Quot.sound\]$'; then
            echo "unexpected axiom set"; exit 1
          fi
# A green run of this job is build evidence only; fidelity to the prose proof is audited in audits/EC-C001_KK_LEAN.md.
