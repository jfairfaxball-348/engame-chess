name: Lean build (EC formal proofs)

# Runs only when Lean sources or this workflow change. Docs, ledger and audit
# commits do not trigger it.
on:
  push:
    paths:
      - 'formal/**'
      - '.github/workflows/lean-build.yml'
  pull_request:
    paths:
      - 'formal/**'
      - '.github/workflows/lean-build.yml'

jobs:
  lean:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: formal
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain') }}
      # Incremental build: Lake keeps per-module trace hashes in .lake, so with a
      # restored cache only changed modules and the modules importing them are
      # rebuilt. Frozen theorem modules are rebuilt only when something they import
      # changes, which is exactly when re-checking them is an obligation. The
      # toolchain is part of the key prefix, so a toolchain bump rebuilds everything.
      - name: Cache Lake build
        uses: actions/cache@v4
        with:
          path: formal/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain') }}-${{ hashFiles('formal/lakefile.toml', 'formal/lake-manifest.json', 'formal/**/*.lean') }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain') }}-
      - name: Install elan (toolchain taken from formal/lean-toolchain)
        run: |
          if ! command -v "$HOME/.elan/bin/elan" >/dev/null; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
            sh /tmp/elan-init.sh -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Toolchain versions
        run: lean --version && lake --version
      - name: KRK01 executable proof extraction (fast fail)
        run: lake build EndgameChess.Rules.KRKExecutable.PrepController
      - name: lake build (incremental)
        run: lake build
      - name: Forbidden proof escapes
        run: |
          if grep -rnE '\b(sorry|admit|axiom|unsafe|native_decide|implemented_by|extern)\b' --include='*.lean' --exclude-dir=.lake .; then
            echo "forbidden token found"; exit 1
          fi
      - name: Axiom report
        run: |
          lake env lean AxiomCheck.lean | tee axioms.txt
          # Allowed: any subset of Lean's standard axioms (or none at all).
          if grep 'depends on axioms' axioms.txt | grep -vE 'depends on axioms: \[(propext|Classical\.choice|Quot\.sound)(, (propext|Classical\.choice|Quot\.sound))*\]$'; then
            echo "unexpected axiom set"; exit 1
          fi
# A green run of this job is build evidence only; fidelity to the prose proof is audited per theorem under audits/.
